name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required SDK packages
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tr ' ' '\n' | head -1)"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" | tail -2
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - name: Compile and package
        run: ./gradlew :app:assembleDebug --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - name: Upload debug APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: debug-latest
          name: Nyx Wallet (Latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Automated build.
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
